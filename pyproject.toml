[project]
name = "imagetool"
version = "0.1.0"
description = "Classifies used-item listings (vinyl, Yu-Gi-Oh cards, board games, electronics) from images and text."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pillow>=10.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
vision = ["torch>=2.2", "open_clip_torch>=2.24"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["imagetool*"]

[tool.setuptools.package-data]
imagetool = ["migrations/*.sql", "classify/keywords/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
